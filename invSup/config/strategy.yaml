# Configuracion de la estrategia. Fuente unica de verdad de los PARAMETROS del
# spec v3.1 seccion 7. Ningun valor numerico vive en el codigo.
#
# Todos los valores por defecto son CONVENCIONES DE LA INDUSTRIA, no resultados:
# los decide la fase 3 (backtest con puerta de validacion, seccion 11.3).

account:
  base_currency: CLP
  equity_scope: [xtb]
  trade_unit: ticker

costs:
  # 0.5 por pierna. Con un round-trip de 1.0 y un R tipico de 8 (seccion 16.2),
  # la friccion vale ~0.125 R: la puerta pide > +0.15 R neto, o sea que el sistema
  # necesita ~+0.275 R bruto. Verificar #10 puede mover ese numero de 45 %.
  fx_fee_per_leg_pct: 0.5
  # Modelo de cobro de la conversion. per_trade_leg = 0.5 en cada pierna;
  # on_funding_only = solo al mover fondos (NO verificado, no usar de momento).
  fx_fee_model: per_trade_leg
  commission_pct: 0.0
  stop_slippage_pct: 0.1
  monthly_commission_free_limit_clp: null

regime:
  index: SPY
  vix_max: 30

# Decision D3 de docs/DECISIONES.md. El margen es una estimacion y por eso es un
# parametro: se ajusta contra lo que se observe en la primera corrida real.
# Por debajo del margen, DATA_GAP. Nunca se usa la vela anterior en silencio.
data:
  min_minutes_after_close: 90
  earnings_source_required: true

risk:
  risk_per_trade_pct: 0.75
  max_position_pct: 10
  max_theme_pct: 30
  max_open_trades: 15
  max_heat_pct: 6
  monthly_loss_limit_pct: 6
  cash_buffer_pct: 3
  max_stop_distance_pct: 12
  # Colchon para el dia de relleno sin stop (seccion 4.5).
  unprotected_buffer_atr: 1.0
  # CAP_TRIM: se dispara cuando el tema pasa max_theme_pct + 5 pp y se vende
  # hasta max_theme_pct + 2 pp (seccion 5.8). Una sola vez por tema y noche.
  theme_trim_trigger_pp: 5
  theme_trim_target_pp: 2
  clusters:
    semis:
      max_pct: 35
      themes: ["semiconductors", "semiconductors_ai"]
      tickers: ["AVGO", "AMD", "MU", "NVDA", "SNDK"]
    ia_ampliada:
      max_pct: 45
      themes: ["semiconductors", "semiconductors_ai", "Technology", "Communication Services"]
      tickers: ["AVGO", "AMD", "MU", "NVDA", "SNDK", "GOOGL", "AMZN", "CRM", "SPCX"]

# Politica de la REVISION MANUAL, no del motor: define el bloque "Resumen
# determinista" de `stats` (banderas, stop tecnico y alertas de concentracion).
# Es solo informativa: no dispara ordenes ni cambia `risk.*`. El stop tecnico no
# reemplaza al del motor (`legacy.max_loss_from_cost_pct`).
briefing:
  position_max_pct: 12
  theme_max_pct: 35
  ia_ampliada_max_pct: 45
  cash_min_pct: 15
  cash_max_pct: 20
  gain_flag_pct: 25
  loss_flag_pct: 10
  rsi_overbought: 70
  rsi_oversold: 30
  atr_flag_pct: 4
  upside_flag_pct: 10
  earnings_flag_sessions: 10
  # Avisos de contexto que pide el prompt v6 antes de decidir.
  min_sessions_alert: 10
  coverage_min_pct: 60
  growth_trap_pct: 300
  cycle_oper_margin_pct: 60
  rsi_percentile_high: 80
  rsi_percentile_low: 20
  atr_percentile_high: 80
  earnings_windows_sessions: [5, 10, 15]
  risk_alert_pct: 2
  take_profit_min_rr: 1.5
  # Tope de recorrido del TP desde el precio actual, por tipo de SL (v6).
  take_profit_max_upside_a_pct: 30
  take_profit_max_upside_b_pct: 40
  # Tipo B (dos alertas SL): ATR % >= 4 o pertenecer al cluster de semis.
  sl_type_b_atr_pct: 4
  # Mapa de liquidez: TP a menos de 15 % del precio.
  liquidity_near_tp_pct: 15
  # Recorrido minimo sobre el precio para aceptar un nivel como take profit. Un
  # nivel mas cercano no es un objetivo: sale "sin techo claro" en vez de un
  # "objetivo" a 0.02 % que empujaria a tomar utilidades en el primer techo.
  take_profit_min_upside_pct: 5
  # Regimen de mercado del Paso 1 del prompt v6.
  regime:
    vix_max: 20
    tnx_above_sma200_pct: 10
    dxy_above_sma200_pct: 5
    near_threshold_pp: 1
  # Stop = soporte mas cercano por debajo del precio - buffer_atr*ATR; sin soporte
  # dentro de max_distance_pct, precio - fallback_atr_mult*ATR. Se acota a
  # [min_atr_mult*ATR, max_distance_pct] bajo el precio. min_atr_mult es piso de
  # distancia (no acerca el stop al ruido); si un ATR muy alto lo empuja mas alla
  # del tope de riesgo, manda max_distance_pct.
  stop:
    buffer_atr: 0.5
    min_atr_mult: 2.0
    max_distance_pct: 15
    fallback_atr_mult: 3.0

# Politica de `PROMPT PORTAFOLIO` implementada como codigo puro. Traduce a numeros
# lo que el prompt pedia calcular a mano (niveles, disparadores T1-T6 y ejes E1-E4)
# para que la IA no gaste tokens en aritmetica. Es informativa: no dispara ordenes.
# El nivel de alarma usa el maximo de 20 sesiones como aproximacion del "maximo
# cierre de 22 sesiones" (el stats no trae esa serie); el informe lo declara.
review:
  levels:
    review_atr_mult: 0.5
    alarm_atr_mult: 3.0
    alarm_floor_atr: 2.5
    alarm_max_distance_pct: 15
    catastrophe_min_pct: 18
    catastrophe_max_pct: 20
    # La catastrofe nunca puede quedar a mas de 25 % bajo la entrada.
    catastrophe_entry_max_loss_pct: 25
    # Si una alerta queda a <3 % de un soporte, baja a 1 % bajo ese soporte.
    sl_support_proximity_pct: 3
    sl_support_buffer_pct: 1
    # Las alertas solo suben: +15 % lleva la Alerta 1 a la entrada; +30 % a entrada+10 %.
    breakeven_gain_pct: 15
    breakeven_extra_gain_pct: 30
    breakeven_extra_pct: 10
    tactical_min_rr: 1.5
    level_raise_r: 2.0
    objective_min_analysts: 10
  triggers:
    # T6 (balance) es el unico disparador medible con el stats actual; el resto exige
    # fuente primaria o historia (ver docs/DECISIONES.md D33).
    current_ratio_max: 1.0
    debt_to_equity_max: 2.5
  axes:
    upside_plus2_pct: 25
    upside_plus1_pct: 15
    upside_zero_pct: 5
    earnings_plus1_sessions: 15
    earnings_minus1_sessions: 10
    earnings_cushion_pct: 8
    earnings_cushion_loose_pct: 5
    near_low_20_pct: 3
    rsi_momentum_low: 40
    rsi_momentum_high: 70
    cycle_oper_margin_pct: 60
    demanding_forward_pe: 35
    weak_fundamentals_min: 2
    action_maintain_total: 2
    action_sell_total: -2
  # Motivo V7 (evento binario con ganancia): recorte tactico del 25 %.
  motives:
    v7_gain_pct: 15
    v7_earnings_sessions: 5
    v7_min_sessions: 10
    v7_partial_pct: 25
  # Motivo V8: liquidacion escalonada hacia marzo de 2027.
  horizon:
    liquidation_date: 2027-03-01
    stagger_start: 2027-01-15
    stagger_days: 14
    tranche_pct: 25
  registry_name: decisions.json

gates:
  rs_lookback_days: 126
  rs_min_percentile: 70
  min_universe: 40
  min_above_52w_low: 1.30
  min_vs_52w_high: 0.75
  min_avg_volume: 1000000
  min_price: 10
  # Blackout de entrada por earnings, en SESIONES (no dias calendario, seccion 4.6).
  earnings_entry_blackout_sessions: 20

# Funcion 2 (screener de compra). Las puertas fundamentales filtran; el score
# ordena. Ningun umbral vive en el codigo. Un tope/piso en null desactiva el filtro.
fundamentals:
  max_forward_pe: 40.0
  max_trailing_pe: 60.0
  max_price_to_book: 12.0
  # El P/B no es comparable entre sectores y su tope absoluto descarta a las empresas
  # asset-light de alto ROE (AAPL P/B 46, ANET 16). Apagado, el valor lo mide el P/E y
  # max_price_to_book / pb_good / pb_bad quedan sin efecto. Encenderlo solo si se acepta
  # el sesgo hacia sectores de activos tangibles.
  use_price_to_book: false
  min_return_on_equity: 0.05
  min_profit_margin: 0.0
  min_revenue_growth: -0.05
  max_debt_to_equity: 3.0
  min_target_upside_pct: 5.0
  min_analyst_count: 0
  require_target: false
  require_fundamentals: false
  # Anclas de normalizacion 0..1 por metrica (good es el mejor extremo).
  score:
    forward_pe_good: 15.0
    forward_pe_bad: 45.0
    pb_good: 2.0
    pb_bad: 10.0
    roe_good: 0.25
    roe_bad: 0.02
    margin_good: 0.20
    margin_bad: 0.0
    debt_good: 0.3
    debt_bad: 2.5
    rev_growth_good: 0.20
    rev_growth_bad: -0.05
    eps_growth_good: 0.20
    eps_growth_bad: -0.10
    upside_good: 0.20
    upside_bad: 0.0
    # Consenso de analistas (recommendationMean: 1 = compra fuerte, 5 = venta).
    rec_good: 1.5
    rec_bad: 3.5
  # Cortes del puntaje por eje del informe de review: cada bloque 0..100 (valor,
  # calidad, crecimiento, proyecciones) se traduce a un eje -2..+2 y la suma es el
  # puntaje del activo. Simetrico alrededor de 50; ningun corte vive en el codigo.
  axes:
    plus2: 75.0
    plus1: 60.0
    minus1: 40.0
    minus2: 25.0
  weights:
    value: 0.30
    quality: 0.30
    growth: 0.20
    projections: 0.20

screener:
  top: 25
  min_composite_score: 0.0
  require_fundamentals: false
  # Fraccion del score final que aporta la fuerza relativa (percentil en todo el
  # universo); el resto es el score fundamental. Momentum de 6 meses es el factor
  # con mas evidencia en horizontes de swing; 0 = solo desempata.
  momentum_weight: 0.30
  # Piso de fuerza relativa: fuera lo que rinde peor que la mitad del universo.
  # null desactiva el piso.
  min_rs_percentile: 50
  # Misma puerta G6 que el motor aplica a una entrada: quien reporta dentro de
  # gates.earnings_entry_blackout_sessions sale del recorte y entra el siguiente.
  exclude_earnings_blackout: true
  # Con la fuente de earnings consultada (no --offline), una fecha ausente no se
  # asume: se rechaza como el motor (INDICATOR_NOT_READY) en vez de recomendar a
  # ciegas. En false, solo filtra el blackout de las fechas conocidas.
  fail_closed_earnings: true
  # No proponer lo que ya se tiene: con export de XTB, los tickers abiertos salen del
  # recorte y entra el siguiente; ademas avisa si un candidato cae en un tema ya sobre
  # risk.max_theme_pct.
  exclude_held: true


setups:
  pullback:
    drop_pct: [5, 10]
    rsi: [38, 55]
    confirm_prior_high: true
    entry_limit_atr: 0.25

stops:
  atr_period: 14
  swing_low_days: 10
  swing_low_buffer_atr: 0.5
  atr_band: [1.5, 3.0]
  breakeven_buffer_pct: 1.0
  min_raise_atr: 0.75

exits:
  tranches:
    - {name: A, fraction: 0.50, tp_r: 1.0}
    - {name: R, fraction: 0.50, tp_r: null}
  exit_limit_atr: 0.5
  runner_trail:
    lookback_days: 22
    atr_mult: 3.0
    tighten_after_days: 60
    tightened_atr_mult: 1.5
  stall:
    days: 15
    min_progress_r: 0.5
  max_hold_days: 90
  min_tp1_cost_multiple: 3
  earnings:
    policy: exit_unlocked
    lead_sessions: 2
  reentry_cooldown_days: 5

operations:
  max_actions_per_evening: 8
  max_new_entries_per_evening: 2

legacy:
  adopt: true
  max_loss_from_cost_pct: 18
  profit_tiers:
    - {gain_pct: 25, sell_fraction: 0.4}
    - {gain_pct: 40, sell_fraction: 0.4}
  post_tier_trail_atr_mult: 3.0

horizon:
  end_date: 2027-03-31
  tighten_days_before: 45
  no_entries_days_before: 30

llm:
  enabled: true
  # false = la IA puede decidir mantener/vender y recomendar compra (motor fija
  # niveles: stop, meta, tamano). true = conserva el diseno original de solo veto.
  veto_only: false
  max_searches_per_ticker: 3
  # Presupuesto de la fase de tesis del screener (segundos). Acota la corrida: agotado
  # el tiempo, los candidatos que falten quedan en candidates.json con verdict null
  # (el ranking determinista ya quedo escrito). Un candidato puede pasarse del tope por
  # el tiempo de su propia llamada (timeout x reintentos).
  screen_budget_s: 240
  weekly_day: sunday

safety:
  # Aviso con n >= 20 (el error estandar de la expectativa ronda 0.2 R y el azar
  # basta para disparar). Modo defensivo con n >= 40 y el margen de error.
  kill_warn_trades: 20
  kill_min_trades: 40
  kill_expectancy_se_mult: 1.0
  kill_max_drawdown_pct: 15

validation:
  min_oos_trades: 150
  expectancy_ci_level: 0.90
  max_earnings_derisk_share_pct: 15
  # Sensibilidad ilustrativa, NO calculo tributario (seccion 11.3 #8).
  tax_sensitivity_pct: [0, 20, 35]