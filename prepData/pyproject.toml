[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prepdata"
version = "1.0.0"
description = "Prepara los datos de una cartera (XTB, finviz, Yahoo y bolsas locales) y pide a la IA el análisis y la recomendación del Prompt Maestro"
readme = "README.md"
# 3.10 es el piso real del codigo (match, X | Y, zoneinfo). No se sube mas porque
# 3.11+ sigue installs en los equipos que lo usan y no hay nada que Ganar.
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<4.0",
    "openpyxl>=3.1,<4.0",
    "requests>=2.31,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "yfinance>=1.5,<2.0",
]

[project.optional-dependencies]
# Los tests live necesitan red y se saltan sin RUN_LIVE_TESTS=1, asi que no son
# una dependencia de la corrida normal.
dev = [
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pandas-stubs>=2.0",
]

[project.scripts]
prepdata = "scraper.cli:main"

[tool.setuptools]
packages = ["scraper"]

[tool.ruff]
line-length = 120
target-version = "py310"
# El reporte emite texto con acentos, flechas y el simbolo de advertencia a proposito.
# No es que falten los caracteres: el archivo esta en UTF-8.
exclude = ["cache", "output"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "RUF",  # reglas propias de ruff
]
ignore = [
    "E501",  # el line-length de ruff ya lo cubre
    "B008",  # argparse/Depends defaults en llamadas: es la norma en CLIs
]

[tool.ruff.lint.per-file-ignores]
# Los fixtures de HTML son archivos de la pagina real, no se pueden reescribir.
"tests/fixtures/*" = ["ALL"]
# RUF001 marca el guion corto: aca es tipografia intencional de un reporte en
# espanol que lee una persona (y un LLM), no un valor que se parsea.
"scraper/report_builder.py" = ["RUF001"]
"tests/test_report_builder.py" = ["RUF001"]
# El guion corto aparece en el texto esperado del reporte, que es prosa.
"tests/test_cli.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
# yfinance y pandas no publican tipos completos; se prefiere no ensuciar el codigo
# con ignores en cada llamada a la libreria.
ignore_missing_imports = true
exclude = ["cache/", "output/"]

[[tool.mypy.overrides]]
# Los tests declaran metodos de test y helpers sin anotar; anotar cada uno no
# aporta y los fixtures son dicts heterogeneos por construccion.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
