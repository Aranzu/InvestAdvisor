# Definicion unica de factores y tema por ticker (PROMPT PORTAFOLIO v8, regla 5).
# "IA ampliada" incluye semiconductores y los proveedores de capex de IA: una sola
# definicion, no dos clusters que se pisan.
max_factor_pct: 40
max_theme_pct: 25

factors:
  ia_ampliada:
    max_pct: 40
    # Equipos de semiconductores + proveedores de capex de IA.
    tickers: [AMD, NVDA, AVGO, ASML, MU, SNDK, AMAT, TSM, ARM, MRVL, QCOM, INTC, KLAC, LRCX, SNPS, CDNS, ANET, VRT, SMCI, DELL, SPCX]
    themes: [semiconductors, semiconductors_ai, Technology, Communication Services]

# Tema/sector por ticker. Es la fuente de verdad cuando el ticker no esta en el
# universo del screener; para el resto se usa el tema del export/universo.
themes:
  GROY: Basic Materials
  AMD: semiconductors
  NVDA: semiconductors_ai
  V: Financial Services
  AVGO: semiconductors_ai
  MELI: Consumer Cyclical
  ASML: Technology
  GOOGL: communication_media
  MU: semiconductors
  UNH: health_care
  NU: Financial Services
  AMAT: Technology
  CRM: software_cloud
  SPCX: Industrials
  SNDK: Technology
