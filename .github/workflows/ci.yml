name: CI

on:
  push:
    paths:
      - "invSup/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "invSup/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: invSup
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: invSup/uv.lock
      - name: Instalar (lockfile)
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
      - name: Ruff (lint)
        run: uv run ruff check src tests
      - name: Ruff (formato)
        run: uv run ruff format --check .
      - name: Mypy (estricto)
        run: uv run mypy src
      - name: Pytest
        run: uv run pytest -q
